<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3ECDC">
  <!-- The tagline leads; the four words after it are for someone meeting a shared link
       cold, who needs to know it is a word puzzle before deciding to tap. -->
  <title>ASTO — This is to that. A word puzzle.</title>

  <!-- Inline, same icon as the process deck: no new asset, no request, no 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2340342A'/%3E%3Ccircle cx='11' cy='16' r='3' fill='%23F3ECDC'/%3E%3Ccircle cx='21' cy='16' r='3' fill='%23D9A741'/%3E%3C/svg%3E">

  <!-- Bree Serif + Nunito. A network nicety, not a dependency: the CSS stacks in
       tokens.css fall back to system fonts when this fails. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:ital,wght@0,600;0,700;0,800;1,600&display=swap">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <!-- Screens are sections; app.js toggles them. A first-time player never sees the
       title screen — GDD §5.2 forces the guided board on first launch. -->
  <section id="screen-title" class="screen" aria-label="ASTO"></section>

  <section id="screen-pours" class="screen" aria-label="Past Pours" hidden></section>

  <section id="screen-stats" class="screen" aria-label="Statistics" hidden></section>

  <section id="screen-play" class="screen" aria-label="Puzzle" hidden>
    <header id="header" class="header"></header>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="frame" class="frame" aria-label="Analogy frame"></div>
    <main id="board" class="board" aria-label="Word tiles"></main>
    <!-- The revealed definition (D-18). Under the board so it reads as a footnote to the
         tiles, and persistent — a definition that vanishes is a memory test. -->
    <div id="vocab" class="vocab-line" role="note" hidden></div>
    <!-- Between the board and the controls on purpose: the coach card must never cover a
         tile, or it could swallow the very tap it is asking for. -->
    <aside id="tutorial-coach" class="coach" aria-live="polite" hidden></aside>
    <div id="controls" class="controls"></div>
    <div id="solved-sets" class="solved-sets" aria-label="Solved sets"></div>
    <!-- The way back to the calendar, in the same place and the same voice as the
         calendar's own Back. Hidden during the tutorial, which has its own exit
         (app.js toggles it) — a first-timer should not have two ways out that
         behave differently. -->
    <button id="board-back" class="text-action" hidden>Back</button>
  </section>

  <section id="screen-end" class="screen" aria-label="Results" hidden></section>

  <section id="screen-error" class="screen" hidden>
    <div class="load-error">
      <h1>ASTO</h1>
      <p id="error-message">Something went wrong loading the puzzle.</p>
    </div>
  </section>

  <script type="module" src="src/app.js"></script>
</body>
</html>
